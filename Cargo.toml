[package]
name = "zitie"
version = "0.1.0"
edition = "2021"
description = "Web 版字帖生成器:支持汉字、英文等任意语言的描红/抄写字帖 PDF 生成"
license = "Apache-2.0"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.12", features = ["cookie"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "set-header", "trace"] }
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "runtime-tokio", "macros"] }
sea-orm-migration = { version = "2.0", features = ["sqlx-sqlite", "runtime-tokio"] }
krilla = "0.8"
skrifa = "0.42"
rustybuzz = "0.20"
rgb = "0.8"
unicode-segmentation = "1.13"
pinyin = "0.11"
uuid = { version = "1", features = ["v4"] }
time = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
