<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="app_title">字帖生成器</title>
  <link rel="stylesheet" href="/static/style.css?v=2">
  <script type="module" src="/static/app.js?v=2" defer></script>
</head>
<body>
  <header class="topbar">
    <h1 data-i18n="app_title">字帖生成器</h1>
    <p class="subtitle" data-i18n="subtitle">汉字 · 英文 · 任意语言 | 描红 / 抄写字帖,支持自定义字体</p>
    <button type="button" id="lang-btn" class="btn slim lang-btn">EN</button>
  </header>

  <main class="layout">
    <!-- ========== 左侧:设置面板 ========== -->
    <form id="panel" autocomplete="off" onsubmit="return false">

      <section class="card">
        <h2 data-i18n="paper">纸型</h2>
        <div class="radio-grid" id="paper-grid">
          <label class="radio-card"><input type="radio" name="paper" value="mizi">
            <svg viewBox="0 0 36 36"><rect x="3" y="3" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3 3 L33 33 M33 3 L3 33 M18 3 V33 M3 18 H33" stroke="currentColor" stroke-width="0.9" stroke-dasharray="2.5 2" fill="none"/></svg>
            <span data-i18n="p_mizi">米字格</span></label>
          <label class="radio-card"><input type="radio" name="paper" value="tianzi">
            <svg viewBox="0 0 36 36"><rect x="3" y="3" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M18 3 V33 M3 18 H33" stroke="currentColor" stroke-width="0.9" stroke-dasharray="2.5 2" fill="none"/></svg>
            <span data-i18n="p_tianzi">田字格</span></label>
          <label class="radio-card"><input type="radio" name="paper" value="huigong">
            <svg viewBox="0 0 36 36"><rect x="3" y="3" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="10.5" y="10.5" width="15" height="15" fill="none" stroke="currentColor" stroke-width="0.9"/></svg>
            <span data-i18n="p_huigong">回宫格</span></label>
          <label class="radio-card"><input type="radio" name="paper" value="zuowen">
            <svg viewBox="0 0 36 36"><g fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="30" height="30"/><path d="M13 3 V33 M23 3 V33 M3 13 H33 M3 23 H33"/></g></svg>
            <span data-i18n="p_zuowen">作文纸</span></label>
          <label class="radio-card"><input type="radio" name="paper" value="sixian">
            <svg viewBox="0 0 36 36"><g stroke="currentColor" stroke-width="1" fill="none"><path d="M3 8 H33 M3 16 H33 M3 24 H33 M3 32 H33"/></g><path d="M10 24 L14 16 L18 24 M19 16 V24 M19 17 L23 24 M27 16 C24 22 27 24 29 22" stroke="currentColor" stroke-width="1.1" fill="none"/></svg>
            <span data-i18n="p_sixian">四线三格</span></label>
          <label class="radio-card"><input type="radio" name="paper" value="hengxian">
            <svg viewBox="0 0 36 36"><path d="M3 22 H33" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M9 22 C7 15 8 12 10 12 C12 12 12 16 12 22 M16 12 V22 M16 13 L21 22 M25 12 V22 M23 12 H27" stroke="currentColor" stroke-width="1" fill="none"/></svg>
            <span data-i18n="p_hengxian">单横线</span></label>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="mode">模式</h2>
        <div class="radio-grid four" id="mode-grid">
          <label class="radio-card"><input type="radio" name="mode" value="miaohong"><span data-i18n="m_miaohong">描红</span></label>
          <label class="radio-card"><input type="radio" name="mode" value="chaoxie"><span data-i18n="m_chaoxie">抄写</span></label>
          <label class="radio-card"><input type="radio" name="mode" value="hunhe"><span data-i18n="m_hunhe">描红+抄写</span></label>
          <label class="radio-card"><input type="radio" name="mode" value="chuntie"><span data-i18n="m_chuntie">纯字帖</span></label>
        </div>
        <div class="row">
          <label class="field" data-for="trace"><span data-i18n="trace_count">描红格数</span><input type="number" name="trace_count" min="1" max="10"></label>
          <label class="field" data-for="copy"><span data-i18n="copy_count">抄写格数</span><input type="number" name="copy_count" min="1" max="10"></label>
        </div>
        <label class="check" data-for="demo"><input type="checkbox" name="row_leading_demo"> <span data-i18n="row_demo">抄写模式行首给示范字</span></label>
        <label class="check" data-for="pinyin"><input type="checkbox" name="pinyin"> <span data-i18n="pinyin_label">汉字上方标注拼音</span></label>
      </section>

      <section class="card">
        <h2 data-i18n="font">字体</h2>
        <div class="row">
          <select id="font-select" class="grow" name="font_id"></select>
          <button type="button" id="font-upload-btn" class="btn" data-i18n="upload_font">上传字体</button>
          <input type="file" id="font-file" accept=".ttf,.otf" hidden>
        </div>
        <div id="font-preview" class="font-preview" hidden></div>
        <div class="hint" data-i18n="font_hint">支持 .ttf / .otf(≤20MB)。内置字体均为开源协议(霞鹜文楷 OFL 等);衡水体等商用字体请自行上传。</div>
        <div id="upload-progress" class="progress" hidden><div class="bar"></div></div>
        <div id="my-fonts" class="my-fonts"></div>
      </section>

      <section class="card">
        <h2 data-i18n="content">练习内容</h2>
        <textarea id="text" name="text" rows="4" data-i18n-ph="content_ph" placeholder="输入要练习的文字,例如:永和九年 岁在癸丑&#10;换行会另起一行;空格占一个格"></textarea>
        <div class="row" style="margin-top:8px">
          <label class="field"><span data-i18n="direction">排列方向</span>
            <select name="direction">
              <option value="auto" data-i18n="dir_auto">自动(按文字判断)</option>
              <option value="ltr" data-i18n="dir_ltr">从左到右</option>
              <option value="rtl" data-i18n="dir_rtl">从右到左</option>
            </select>
          </label>
        </div>
        <div class="hint row-between"><span id="char-count">0 字</span><span class="hint-ops">
          <button type="button" class="linklike" data-sample="永和九年岁在癸丑暮春之初" data-i18n="s_lanting">《兰亭集序》</button>
          <button type="button" class="linklike" data-sample="床前明月光疑是地上霜举头望明月低头思故乡" data-i18n="s_jingye">《静夜思》</button>
          <button type="button" class="linklike" data-sample="abcdefghijklmnopqrstuvwxyz" data-i18n="s_abc">字母表</button>
        </span></div>
      </section>

      <section class="card">
        <h2 data-i18n="header">页眉</h2>
        <label class="field"><span data-i18n="title_label">标题</span><input type="text" name="title" maxlength="40" data-i18n-ph="title_ph" placeholder="如:三年级语文生字练习"></label>
        <div class="fields" id="header-fields"></div>
        <button type="button" id="add-field" class="btn slim" data-i18n="add_field">+ 添加字段</button>
        <label class="check"><input type="checkbox" name="page_number"> <span data-i18n="page_number">显示页码</span></label>
      </section>

      <details class="card">
        <summary><h2 data-i18n="size_color">尺寸与颜色</h2></summary>
        <div class="row">
          <label class="field" data-for="cell-size"><span data-i18n="cell_size">格子大小 pt</span><input type="number" name="cell_size_pt" min="20" max="100" step="0.5" data-i18n-ph="auto" placeholder="自动"></label>
          <label class="field" data-for="line-height"><span data-i18n="line_height">行高 pt</span><input type="number" name="line_height_pt" min="10" max="50" step="0.5" data-i18n-ph="auto" placeholder="自动"></label>
          <label class="field" data-for="cell-width"><span data-i18n="cell_width">格宽 pt</span><input type="number" name="cell_width_pt" min="8" max="100" step="0.5" data-i18n-ph="auto" placeholder="自动"></label>
        </div>
        <div class="row">
          <label class="field"><span data-i18n="cols">每行格数</span><input type="number" name="cols_per_row" min="4" max="40" data-i18n-ph="auto" placeholder="自动"></label>
          <label class="field"><span data-i18n="col_gap">格间距 pt</span><input type="number" name="col_gap_pt" min="0" max="30" step="0.5"></label>
          <label class="field"><span data-i18n="row_gap">行间距 pt</span><input type="number" name="row_gap_pt" min="0" max="40" step="0.5"></label>
        </div>
        <div class="row">
          <label class="field"><span data-i18n="margin_top">上边距 mm</span><input type="number" name="margin_top" min="5" max="40" step="0.5"></label>
          <label class="field"><span data-i18n="margin_bottom">下边距 mm</span><input type="number" name="margin_bottom" min="5" max="40" step="0.5"></label>
          <label class="field"><span data-i18n="margin_lr">左右边距 mm</span><input type="number" name="margin_lr" min="5" max="40" step="0.5"></label>
        </div>
        <div class="row colors">
          <label class="color"><span data-i18n="c_grid">格线</span><input type="color" name="c_grid"></label>
          <label class="color"><span data-i18n="c_light">描红</span><input type="color" name="c_light"></label>
          <label class="color"><span data-i18n="c_demo">示范</span><input type="color" name="c_demo"></label>
          <label class="color"><span data-i18n="c_solid">实字</span><input type="color" name="c_solid"></label>
        </div>
      </details>
    </form>

    <!-- ========== 右侧:预览 ========== -->
    <section class="preview-col">
      <div class="toolbar">
        <div class="history-wrap">
          <button type="button" id="history-btn" class="btn" data-i18n="history">历史</button>
          <div id="history-panel" class="history-panel" hidden></div>
        </div>
        <span id="status" class="status" data-i18n="ready">就绪</span>
        <span class="spacer"></span>
        <button type="button" id="print-btn" class="btn" data-i18n="print">打印</button>
        <a id="download-btn" class="btn primary" download data-i18n="download">下载 PDF</a>
      </div>
      <div class="frame-wrap">
        <iframe id="preview" title="字帖预览"></iframe>
        <div id="mobile-hint" class="mobile-hint" hidden>
          <span data-i18n="mobile_hint">当前浏览器可能不支持内嵌 PDF 预览,请使用「下载 PDF」按钮。</span>
        </div>
      </div>
    </section>
  </main>

  <div id="toasts" class="toasts"></div>
</body>
</html>
